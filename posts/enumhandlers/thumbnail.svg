<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <!-- Window background -->
  <rect width="800" height="520" rx="10" fill="#1c1e20"/>
  <!-- Header bar -->
  <rect width="800" height="42" rx="10" fill="#2a2c2e"/>
  <rect y="32" width="800" height="10" fill="#2a2c2e"/>
  <!-- Traffic lights -->
  <circle cx="22" cy="21" r="7" fill="#ff5f57"/>
  <circle cx="44" cy="21" r="7" fill="#febc2e"/>
  <circle cx="66" cy="21" r="7" fill="#28c840"/>
  <!-- Language label -->
  <text x="776" y="26" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#666" text-anchor="end">C</text>

  <!-- Code content — padding 28px left, 58px top, line-height 26px -->

  <!-- NTSTATUS status = 0; -->
  <text x="28" y="80" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">NTSTATUS status </text>
  <text x="224" y="80" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">= </text>
  <text x="245" y="80" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">0</text>
  <text x="254" y="80" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">;</text>

  <!-- PVOID pbuffer = nullptr; -->
  <text x="28" y="106" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">PVOID pbuffer </text>
  <text x="200" y="106" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">= </text>
  <text x="221" y="106" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">nullptr</text>
  <text x="302" y="106" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">;</text>

  <!-- ULONG size = 0; -->
  <text x="28" y="132" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">ULONG size </text>
  <text x="165" y="132" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">= </text>
  <text x="186" y="132" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">0</text>
  <text x="195" y="132" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">;</text>

  <!-- blank -->

  <!-- // Query Process Information -->
  <text x="28" y="184" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#888">// Query Process Information</text>

  <!-- status = NtQuerySystemInformation(...) -->
  <text x="28" y="210" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">status = </text>
  <text x="119" y="210" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#4dc9a0">NtQuerySystemInformation</text>
  <text x="444" y="210" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">(SystemProcessInformation, pbuffer, </text>
  <text x="713" y="210" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">0</text>
  <text x="722" y="210" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">, &amp;size);</text>

  <!-- printf -->
  <text x="28" y="236" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">printf(</text>
  <text x="93" y="236" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#98c379">"Bytes: %u\n"</text>
  <text x="228" y="236" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">, size);</text>

  <!-- blank -->

  <!-- // Reserves memory -->
  <text x="28" y="288" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#888">// Reserves memory</text>

  <!-- status = NtAllocateVirtualMemory(...) -->
  <text x="28" y="314" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">status = </text>
  <text x="119" y="314" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#4dc9a0">NtAllocateVirtualMemory</text>
  <text x="428" y="314" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">(</text>
  <text x="436" y="314" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#4dc9a0">NtCurrentProcess</text>
  <text x="636" y="314" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">(), &amp;pbuffer, </text>
  <text x="752" y="314" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">0</text>
  <text x="760" y="314" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">,…</text>

  <!-- if (!NT_SUCCESS(status)) { -->
  <text x="28" y="340" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">if (!</text>
  <text x="71" y="340" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">NT_SUCCESS</text>
  <text x="179" y="340" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">(status)) {</text>

  <!-- printf error -->
  <text x="52" y="366" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">printf(</text>
  <text x="117" y="366" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#98c379">"Error reserving memory (status: 0x%X)\n"</text>
  <text x="620" y="366" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">, status);</text>

  <!-- return status; -->
  <text x="52" y="392" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">return status;</text>

  <!-- } -->
  <text x="28" y="418" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">}</text>

  <!-- SYSTEM_PROCESS_INFORMATION -->
  <text x="28" y="470" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">SYSTEM_PROCESS_INFORMATION </text>
  <text x="370" y="470" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">*</text>
  <text x="378" y="470" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">p = (SYSTEM_PROCESS_INFORMATION</text>
  <text x="680" y="470" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#f07070">*</text>
  <text x="688" y="470" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13.5" fill="#e0e0e0">)pbuffer;</text>

  <!-- Bottom rounded corners fill -->
  <rect x="0" y="510" width="800" height="10" fill="#1c1e20"/>
</svg>
